name: llmops-harness
# Rebuilt, scanned metrics/tracing stack. Grafana awaits patched signed plugins.
services:
  prometheus:
    build:
      context: ./secure
      dockerfile: Prometheus.Dockerfile
    image: llmops-prometheus-security:local
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_secure_data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    extra_hosts: ['host.docker.internal:host-gateway']
  jaeger:
    build:
      context: ./secure
      dockerfile: Jaeger.Dockerfile
    image: llmops-jaeger-security:local
    ports: ['127.0.0.1:16686:16686', '127.0.0.1:4318:4318']
volumes:
  # A fresh Prometheus 3 store leaves the previous Prometheus/Grafana volumes intact.
  prometheus_secure_data:
